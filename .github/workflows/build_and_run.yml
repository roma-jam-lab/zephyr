name: Build and Run

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: startsWith(github.head_ref, 'pr-add-ci-') || startsWith(github.head_ref, 'pr-add-dwc2-')
    runs-on: ubuntu-latest

    container:
      image: zephyrprojectrtos/ci:v0.28.7

    steps:
